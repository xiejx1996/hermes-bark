name: hermes-bark
label: Bark
kind: platform
manifest_version: 2
version: 0.2.1
description: >
  Bark iOS push notifications as a Hermes delivery platform (send-only).
  Enables cron `deliver=bark`, `hermes send --to bark[:device]`, the in-session
  send_message tool, and optional turn/subagent-end notifications. Supports
  multi-device aliases, level/sound/group/ttl/url/image, retry with
  never-left-only semantics, and profile-scoped secret resolution.

  Bark is one-way: there is no inbound stream, no reply channel, and a server
  200 means "queued to APNs", not "seen on the phone".

author: 1maker
license: MIT
requires_hermes: ">=0.23.2"
tags: [bark, ios, push, notifications, platform]

# Declared capabilities: `hermes plugins validate` probes register() and fails
# the manifest when the plugin registers more than it declares (catalog rule 6).
provides_tools:
  - bark_notify
provides_hooks:
  - on_session_end
  - pre_llm_call
  - subagent_stop

# Manifest env metadata drives `hermes config` / the dashboard card only.
# Runtime reads go through settings.secret(), i.e. Hermes' credential routing
# (profile secret scope, process env for CLI): the plugin never parses .env
# itself, and a key saved from the dashboard is published into the scope.
requires_env:
  - name: BARK_TOKEN
    description: "Default Bark device key (found in the Bark app)"
    prompt: "Bark device key"
    password: true

optional_env:
  - name: BARK_SERVER
    description: "Bark server URL (default: https://api.day.app; self-hosted is fine)"
    prompt: "Bark server URL (or empty)"
    password: false
  - name: BARK_HOME_CHANNEL
    description: "Cron/notification target: a device alias or a raw key (default: default device)"
    prompt: "Bark home target (alias or empty)"
    password: false
  - name: BARK_KEY_IPHONE
    description: "Device key for alias 'iphone' (pattern: BARK_KEY_<ALIAS>)"
    prompt: "Device key for iphone (or empty)"
    password: true

# Rendered natively under Settings → Plugins and written by plugins.manage into
# plugins.entries.hermes-bark.settings (atomic, schema-validated). Devices and
# keys are NOT here on purpose: a key is a secret and belongs in Hermes'
# credential store (BARK_KEY_<ALIAS>), never in config.yaml.
config_schema:
  server:
    type: str
    default: "https://api.day.app"
    label: Bark server
    description: "Defaults to https://api.day.app; point it at your own server if self-hosted (plain HTTP is for a LAN you control)."
  proxy:
    type: str
    default: ""
    label: Proxy
    description: "Empty = follow HTTPS_PROXY; direct = ignore the environment; or an explicit proxy URL such as http://127.0.0.1:7897"
  title:
    type: str
    default: "Hermes"
    label: Default title
    description: "Title at the top of the notification card; cron and hook pushes inherit it."
  default_device:
    type: str
    default: ""
    label: Default device
    description: "Alias used when a target is empty; empty = default (BARK_TOKEN) or the first configured device."
  level:
    type: str
    choices: [active, timeSensitive, critical, passive]
    default: timeSensitive
    label: Interruption level
    description: "timeSensitive breaks through Focus; critical needs in-app permission; passive lands quietly in Notification Center."
  group:
    type: str
    default: "Hermes"
    label: Notification group
    description: "Pushes in one group are stacked together in Notification Center."
  sound:
    type: str
    default: ""
    label: Sound
    description: "A Bark ringtone name (e.g. bell, alarm), or empty for the system default."
  icon:
    type: str
    default: ""
    label: Icon URL
    description: "Overrides the notification icon (http(s) image URL)."
  ttl:
    type: int
    default: 0
    label: TTL (seconds)
    description: "Stop delivering after this many seconds; 0 = no limit."
  notify_turn_end:
    type: bool
    default: false
    label: Push when a turn ends
    description: "Push when a turn finishes (default: failures and interruptions only, so a normal chat stays quiet)."
  notify_turn_end_min_duration_s:
    type: float
    default: 90
    label: Minimum turn duration (s)
    description: "Successful turns shorter than this are not pushed; failures and interruptions always are."
  notify_turn_end_statuses:
    type: str
    default: "failed,interrupted"
    label: Turn-end statuses
    description: "Comma separated: completed / failed / interrupted"
  notify_subagent_stop:
    type: bool
    default: false
    label: Push when a subagent stops
    description: "Push a summary after each delegate_task subagent finishes."
  notify_subagent_stop_min_duration_ms:
    type: float
    default: 30000
    label: Minimum subagent duration (ms)
    description: "Short tasks are skipped so parallel subagents cannot flood the phone."
  notify_quiet_hours:
    type: str
    default: ""
    label: Quiet hours
    description: "e.g. 23:30-08:00 (comma separated for several windows); every automatic push is skipped inside them."
  dedupe:
    type: bool
    default: true
    label: 5-second dedupe
    description: "Identical content within 5 seconds of the same session is pushed once (Bark id field)."
  allow_private_image_urls:
    type: bool
    default: false
    label: Allow private-network image URLs
    description: "The Bark app on the phone fetches the image itself; only enable this when the phone can reach that network."
  alert_max_title_weight:
    type: int
    default: 36
    label: Alert title budget (display units)
    description: "36 ≈ 18 Chinese characters. The title is one line and iOS ellipsises it (measured: cut around 37-39 units), so keep the outcome in it."
  alert_collapsed_weight:
    type: int
    default: 140
    label: Collapsed-view budget (display units)
    description: "What the lock screen shows before a long-press: four lines, ~140 units ≈ 70 Chinese characters (measured 84 on a current iPhone; 140 leaves room for narrower screens). A first sentence wider than this is flagged in the tool result."
  missing_alert:
    type: str
    choices: [passthrough, reject]
    default: passthrough
    label: Text without an alert
    description: "passthrough: send the text as the body, exactly like a plugin with no alert support. reject: refuse text that does not fit the collapsed lock screen, so an unwritten alert cannot pass silently."
